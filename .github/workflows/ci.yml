name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR makes the older run pointless; on main every
# commit keeps its own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbopack writes its build cache to .next/cache (on by default since
      # Next 16.3); restoring it makes `next build` start warm.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'types/**', '*.ts', '*.mjs', 'prisma/schema.prisma') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm lint
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://tarot:tarot@localhost:5432/tarot
          AUTH_SECRET: ci-build-placeholder-secret

  # Runs alongside `build` rather than after it: Playwright's webServer does
  # its own `pnpm build`, so waiting on the other job only added its runtime.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tarot
          POSTGRES_PASSWORD: tarot
          POSTGRES_DB: tarot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tarot:tarot@localhost:5432/tarot
      AUTH_SECRET: ci-build-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'types/**', '*.ts', '*.mjs', 'prisma/schema.prisma') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm exec prisma migrate deploy
      # Unit tests run only here, where the database exists, so the
      # rate-limiter tests run instead of being skipped.
      - run: pnpm test

      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # Cached browsers still need their system libraries on a fresh runner.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e
